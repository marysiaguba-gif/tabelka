<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GamesZone</title>

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Merriweather',serif;
  background:#050507;
  color:#fff;
  font-weight:500;
}

header{
  padding:3rem 2rem;
  text-align:center;
  background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.9)),
    url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1400&q=60');
  background-size:cover;
  background-position:center;
  border-bottom:2px solid #ff0033;
  box-shadow:0 0 25px #ff0033;
}

h1{
  color:#ff0033;
  font-size:3rem;
  text-shadow:0 0 10px #ff0033;
  font-weight:700;
}

.controls{
  display:flex;
  gap:1rem;
  justify-content:center;
  flex-wrap:wrap;
  padding:1rem;
}

input,select,button{
  padding:0.7rem 1rem;
  border-radius:8px;
  border:1px solid #ff0033;
  background:#0b0b0f;
  color:#fff;
  cursor:pointer;
  box-shadow:0 0 10px #ff003355;
  font-family:'Merriweather',serif;
}

button:hover{
  background:#ff0033;
  color:#000;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:200px;
  height:100%;
  background:#0b0b0f;
  border-right:2px solid #ff0033;
  padding-top:2rem;
  box-shadow:0 0 20px #ff003322;
}

.sidebar h3{
  color:#ff0033;
  text-align:center;
  margin-bottom:1rem;
}

.sidebar-liked{
  width:100%;
  padding:0.8rem;
  background:#0b0b0f;
  border:none;
  color:#ff0033;
  font-weight:700;
  cursor:pointer;
  border-bottom:1px solid #ff0033;
}

.sidebar-liked:hover{
  background:#ff003320;
}

.cat-btn{
  display:block;
  width:100%;
  padding:0.7rem;
  background:none;
  border:none;
  color:#fff;
  text-align:left;
  cursor:pointer;
  border-left:3px solid transparent;
}

.cat-btn:hover{
  background:#ff003320;
}

.cat-btn.active{
  border-left:3px solid #ff0033;
  color:#ff0033;
}

.main{
  margin-left:200px;
}

.section-title{
  max-width:1200px;
  margin:1.5rem auto 0;
  padding:0 1rem;
  color:#ff0033;
  font-size:1.2rem;
  text-shadow:0 0 8px #ff0033;
  font-weight:700;
}

.games{
  max-width:1200px;
  margin:1rem auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:1.5rem;
  padding:0 1rem;
  transition:opacity .3s ease;
}

.games.fade{opacity:0;}

.card{
  background:#0b0b0f;
  border:1px solid #ff003344;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 0 10px #ff003322;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 20px #ff0033aa;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-bottom:1px solid #ff0033;
}

.card h3{
  padding:0.7rem;
  color:#ff0033;
  font-weight:700;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
}

.modal-content{
  max-width:850px;
  margin:3rem auto;
  background:#0b0b0f;
  border:1px solid #ff0033;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 0 25px #ff0033aa;
}

.modal img{
  width:100%;
  height:360px;
  object-fit:cover;
  border-bottom:2px solid #ff0033;
}

.modal-body{
  padding:2rem;
  font-size:1.05rem;
  line-height:1.8;
  font-weight:500;
}

.close{
  float:right;
  font-size:2.5rem;
  cursor:pointer;
  color:#ff0033;
  text-shadow:0 0 10px #ff0033;
}

.btn{
  display:inline-block;
  margin-top:1rem;
  padding:0.7rem 1.5rem;
  background:#ff0033;
  color:#000;
  border-radius:8px;
  text-decoration:none;
  box-shadow:0 0 15px #ff0033;
}

.like{
  font-size:1.7rem;
  cursor:pointer;
  margin-left:1rem;
  color:#555;
  transition:.2s;
}

.like.active{
  color:#ff0033;
  text-shadow:0 0 10px #ff0033;
}

.counter{
  color:#ff0033;
  margin-left:6px;
}

</style>
</head>
<body>

<div class="sidebar">
<h3>Kategorie</h3>

<button class="sidebar-liked" onclick="toggleLikedView()">
❤️ Ulubione <span id="count">0</span>
</button>

<button class="cat-btn active" onclick="setCat('all')">Wszystkie</button>
<button class="cat-btn" onclick="setCat('horror')">Horror</button>
<button class="cat-btn" onclick="setCat('fps')">FPS</button>
<button class="cat-btn" onclick="setCat('sandbox')">Sandbox</button>
<button class="cat-btn" onclick="setCat('racing')">Wyścigi</button>
</div>

<div class="main">

<header>
<h1>🎮 GamesZone</h1>
</header>

<div class="controls">
<input id="search" placeholder="Szukaj gry..." oninput="render()" />
<select id="sort">
  <option value="az">A-Z</option>
  <option value="za">Z-A</option>
</select>
</div>

<div class="section-title" id="title">🎮 Gry</div>
<div class="games" id="games"></div>

</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <img id="mimg" />
    <div class="modal-body">
      <h2 id="mtitle"></h2>
      <h3>📖 Historia</h3>
      <p id="mhist"></p>
      <h3>🎮 Gameplay</h3>
      <p id="mgame"></p>
      <a id="mlink" class="btn" target="_blank">🌐 Strona gry</a>
      <span id="likeBtn" class="like" onclick="toggleLike()">❤</span>
    </div>
  </div>
</div>

];

let current=null;
let liked=JSON.parse(localStorage.getItem("liked")||"{}");
let cat="all";
let likedView=false;

function setCat(c){
cat=c;
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
render();
}

function animateRender(list){
const box=document.getElementById("games");
box.classList.add("fade");
setTimeout(()=>{
box.innerHTML=list.map(g=>`
<div class='card' onclick='openM(${games.indexOf(g)})'>
<img src='${g.img}' />
<h3>${g.name}</h3>
</div>`).join('');
box.classList.remove("fade");
},200);
}

function render(){
const s=document.getElementById("search").value.toLowerCase();
const sort=document.getElementById("sort").value;

let list=games.filter(g=>g.name.toLowerCase().includes(s)&&(cat=="all"||g.cat==cat));

list.sort((a,b)=>sort=="az"?a.name.localeCompare(b.name):b.name.localeCompare(a.name));

if(likedView){
list=list.filter((g,i)=>liked[games.indexOf(g)]);
}

animateRender(list);
updateCount();
}

function updateCount(){
document.getElementById("count").innerText=Object.values(liked).filter(Boolean).length;
}

function toggleLikedView(){
likedView=!likedView;
render();
}

function openM(i){
current=i;
const g=games[i];

mimg.src=g.img;
mtitle.innerText=g.name;
mhist.innerText=g.hist;
mgame.innerText=g.game;
mlink.href=g.link;

updateLike();
modal.style.display='block';
}

function closeModal(){modal.style.display='none';}

function toggleLike(){
liked[current]=!liked[current];
localStorage.setItem("liked",JSON.stringify(liked));
updateLike();
render();
}

function updateLike(){
const el=document.getElementById("likeBtn");
liked[current]?el.classList.add("active"):el.classList.remove("active");
}

render();
</script>
